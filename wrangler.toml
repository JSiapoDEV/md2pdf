name = "md2pdf"
main = "worker.js"
compatibility_date = "2026-04-01"

[assets]
directory = "./public"
binding = "ASSETS"

[[kv_namespaces]]
binding = "DOCS"
id = "a6b32dd5e339407998e719b0baa1dcb8"

# Rate limit for writes (save, update, delete), per client IP or IPv6 /64.
# Unlike the old KV counter, it spends none of KV's daily write quota.
[[ratelimits]]
name = "WRITE_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 10
  period = 60

# Daily write quota per client, and atomic one-time reads. The object keeps
# counters only and deletes its own storage when the day (or the claim) ends.
[[durable_objects.bindings]]
name = "QUOTA"
class_name = "QuotaCounter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["QuotaCounter"]

# md2pdf Pro, a one-year pass sold through Polar (the merchant of record).
# The pass's license key is the Pro key: the Worker checks it with Polar's
# public validation endpoint, which needs no token, and keeps only a hash of
# the key with the verdict. Until POLAR_BENEFIT_ID holds the real benefit (the
# nil UUID is a placeholder) no Polar key is accepted; until POLAR_CHECKOUT_URL
# holds the checkout link, the offer is shown nowhere.
[vars]
POLAR_ORG_ID = "70a0d0a3-ab23-4a01-b3af-400efc6d05c1"
POLAR_BENEFIT_ID = "00000000-0000-0000-0000-000000000000"
POLAR_CHECKOUT_URL = ""

# Keys can also be issued by hand, for gifts and tests:
#   node scripts/pro-key.mjs        (prints the key to hand over and its hash)
#   npx wrangler secret put PRO_KEY_HASHES   (comma-separated hashes)
# The Worker only ever sees hashes; the keys themselves are not stored anywhere.

# Anonymous counts: event name, kind of client and, for Pro signals, which
# limit was hit. No IP address, no identifier, no content. Cloudflare creates
# the dataset on the first write and keeps data points for three months.
[[analytics_engine_datasets]]
binding = "EVENTS"
dataset = "md2pdf_events"
