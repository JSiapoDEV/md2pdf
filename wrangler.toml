name = "md2pdf"
main = "worker.js"
compatibility_date = "2026-04-01"

[assets]
directory = "./public"
binding = "ASSETS"

[[kv_namespaces]]
binding = "DOCS"
id = "a6b32dd5e339407998e719b0baa1dcb8"

# Rate limit for writes (save, update, delete), per client IP or IPv6 /64.
# Unlike the old KV counter, it spends none of KV's daily write quota.
[[ratelimits]]
name = "WRITE_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 10
  period = 60

# Daily write quota per client, and atomic one-time reads. The object keeps
# counters only and deletes its own storage when the day (or the claim) ends.
[[durable_objects.bindings]]
name = "QUOTA"
class_name = "QuotaCounter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["QuotaCounter"]

# Pro API keys. Billing does not exist yet, so keys are issued by hand:
#   node scripts/pro-key.mjs        (prints the key to hand over and its hash)
#   npx wrangler secret put PRO_KEY_HASHES   (comma-separated hashes)
# The Worker only ever sees hashes; the keys themselves are not stored anywhere.

# Anonymous counts: event name, kind of client and, for Pro signals, which
# limit was hit. No IP address, no identifier, no content. Cloudflare creates
# the dataset on the first write and keeps data points for three months.
[[analytics_engine_datasets]]
binding = "EVENTS"
dataset = "md2pdf_events"
